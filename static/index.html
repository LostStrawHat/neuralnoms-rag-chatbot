<!DOCTYPE html>
<html>
<head>
  <title>NeuralNoms 🍳</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    #chat { border: 1px solid #ccc; padding: 15px; height: 400px; overflow-y: scroll; border-radius: 8px; }
    .msg { margin-bottom: 15px; }
    .user { font-weight: bold; color: #0077ff; }
    .bot { font-weight: bold; color: #ff6600; }
    input { width: 80%; padding: 10px; }
    button { padding: 10px; }
  </style>
</head>

<body>
  <h1>NeuralNoms 🍜</h1>
  <div id="chat"></div>

  <br>
  <input id="input" placeholder="Ask for a recipe...">
  <button onclick="send()">Send</button>

  <script>
    async function send() {
      const text = document.getElementById("input").value;
      document.getElementById("input").value = "";

      addMessage("You", text);

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: text })
      });

      const data = await res.json();
      addMessage("NeuralNoms", data.response);
    }

    function addMessage(sender, text) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = "msg";
      div.innerHTML = `<span class="${sender === 'You' ? 'user' : 'bot'}">${sender}:</span> ${text}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
